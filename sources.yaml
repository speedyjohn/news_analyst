# Единственный источник правды по источникам. Код о конкретных сайтах не знает.
# После правки — перезапуск api (синхронизация в таблицу sources идёт на старте).
#
# type:   rss | html
# parser: rss | html  (html читает блок selectors ниже)
# priority: чем меньше, тем выше приоритет при дедупликации одинаковых новостей.
# enabled: false + комментарий — источник заведён, но не собирается.

- code: akorda
  name: Акорда · Пресс-служба Президента РК
  country: KZ
  category_hint: political_economic
  type: rss
  url: https://www.akorda.kz/ru/events
  feed_url: https://www.akorda.kz/ru/rss
  parser: rss
  priority: 1
  enabled: true
  selectors:
    # Фид отдаёт пустые description и относительные ссылки — текст берём со страницы.
    body: "div.col-lg-8"

- code: primeminister
  name: Правительство РК
